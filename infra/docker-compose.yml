services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: payments-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://payments-kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - payments-net

  spark:
    image: apache/spark:3.5.3
    container_name: payments-spark
    user: root
    environment:
      SPARK_MODE: master
    ports:
      - "8080:8080"
    volumes:
      - ../src:/opt/app/src
      - ../data:/opt/app/data
      - ../checkpoints:/opt/app/checkpoints
    networks:
      - payments-net
    entrypoint: ["tail", "-f", "/dev/null"]
    tty: true

volumes:
  kafka-data:

networks:
  payments-net:
    driver: bridge